[project]
name = "backend"
version = "0.1.0"
description = "backend app for optician"
authors = [
    {name = "Davidwgit82",email = "davidyvwork082@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=6.0.7,<7.0.0)",
    "cloudinary (>=1.45.0,<2.0.0)",
    "django-cloudinary-storage (>=0.3.0,<0.4.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "django-environ (>=0.14.0,<0.15.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "django-filter (>=26.1,<27.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)"
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "django-debug-toolbar (>=7.0.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)"
]
